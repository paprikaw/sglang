schema_version: 2
last_updated: "2026-08-05"
source_good_config: "persistent-NCCL dynamic PP controller implementation"
description: >
  Fixed guard baseline for the current Llama-70B synthetic 128-input,
  256-output, max-batched-token-256 profiling family using one resident
  controller per GPU and the persistent full-group NCCL data plane. Pipeline
  layout remains an experiment variable.

allowed_runtime_fields:
  - envs.VLLM_DYNAMIC_PP_CUDA_PROFILE
  - envs.VLLM_DYNAMIC_PP_CUDA_PROFILE_DIR
  - envs.VLLM_DYNAMIC_PP_CUDA_PROFILE_FLUSH_RECORDS
  - envs.VLLM_DYNAMIC_PP_CUDA_PROFILE_SAMPLE_EVERY
  - envs.VLLM_DYNAMIC_PP_CUDA_PROFILE_KINDS
  - envs.VLLM_DYNAMIC_PP_LIFETIME_TRACE
  - envs.VLLM_DYNAMIC_PP_NCCL_EDGE_TRACE
  - envs.VLLM_DYNAMIC_PP_NCCL_DEBUG
  - envs.VLLM_AUTOSCALING_KVCACHED_DEBUG
  - envs.VLLM_AUTOSCALING_KVCACHED_DEBUG_VERBOSE

defaults:
  static_config:
    model:
      path: "/data/gpfs/projects/punim2715/huggingface/Llama-3.3-70B-Instruct-FP8"
      name: "Llama-3.3-70B-Instruct-FP8"
    vllm:
      gpu_memory_utilization: 0.95

required:
  top_level:
    type: "sweep_test"
    is_log_cover: true
    overwrite: true

  envs:
    RAY_DEDUP_LOGS: "0"
    NCCL_DEBUG: "INFO"
    NCCL_CUMEM_HOST_ENABLE: "0"
    VLLM_NCCL_SO_PATH: "/apps/easybuild-2022/easybuild/software/Compiler/GCCcore/11.3.0/NCCL/2.21.5-CUDA-12.4.1/lib/libnccl.so.2.21.5"
    VLLM_TORCH_PROFILER_DIR: "/home/bxb1/data/vllm_workbench/profiler/"
    RAY_CGRAPH_get_timeout: "10000"
    BENCHMARK_CONFIG_PATH: "/home/bxb1/data/tmp/vllm_exp/benchmark_config_pp12_default_kvcached.json"
    DEPLOYMENT_CONFIG_PATH: "/home/bxb1/data/tmp/vllm_exp/vllm_config_pp12_default_kvcached.json"
    KV_SYNC_USE_CPU: "0"
    VLLM_USE_CPU_MODEL: "0"
    CUDA_LAUNCH_BLOCKING: "0"
    PYTORCH_CUDA_ALLOC_CONF: "max_split_size_mb:32"
    VLLM_USE_RAY_COMPILED_DAG_OVERLAP_COMM: "0"
    VLLM_USE_RAY_COMPILED_DAG: "0"
    VLLM_USE_RAY_SPMD_WORKER: "1"
    VLLM_DYNAMIC_PP_NCCL_TRANSPORT: "1"
    VLLM_DYNAMIC_PP_NCCL_PERSISTENT: "1"
    NCCL_SOCKET_IFNAME: "bond0.3027"
    GLOO_SOCKET_IFNAME: "bond0.3027"
    VLLM_SERVER_DEV_MODE: "1"
    VLLM_DISABLE_CUTLASS_FP8: "1"
    VLLM_PAGE_ATTENTION_BLOCK_SIZE_KB: "128"
    VLLM_KVCACHE_BACKEND: "kvcached"
    KVCACHED_PAGE_SIZE_MB: "2"
    KVCACHED_CONTIGUOUS_LAYOUT: "false"
    KVCACHED_LAYER_STACKING: "false"

  static_config:
    vllm:
      head_addr: "localhost"
      disable_memory_overhead_monitor: true
      max_model_len: 4000
      chunked_prefill: true
      enable_cuda_graph: false
      enable_nsight: false
      weight_chunk_size_mb: 5
      max_num_batched_tokens: 256
      max_num_seqs: 256
    benchmark:
      dataset_name: "pattern"
      burstiness: 400.0
      pattern_batch_size: 1000
      ignore_eos: true
      profile: false
      print_outputs: false
      repetition: 1
      restart_server_between_repetitions: false
      warmup:
        enabled: false

  sweep_configs:
    vllm:
      max_num_batched_tokens: [256]
      attention_kernel: ["direct"]
      fixed_num_gpu_blocks: [-1]
      weight_chunk_size_mb: [160]
      migration_approach: ["async"]
      weight_loading_mode: ["async"]
      block_size: [32]
      use_vmm: [true]
      enable_kv_resize: [true]
      enable_cpu_weight_cache: [true]
